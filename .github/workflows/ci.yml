name: CI

# Проверяем не только код, но и ДАННЫЕ: на каждом пуше пайплайн заново
# генерирует базу с нуля и прогоняет по ней тесты качества.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # можно запустить вручную из вкладки Actions

jobs:
  data-quality:
    name: ETL + data quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false      # падение на одной версии Python не отменяет остальные
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL pipeline (generate database from scratch)
        run: python src/data_loader.py

      - name: Build analytics marts and figures
        run: python src/analytics.py

      - name: Run data quality tests
        run: pytest tests/ -v

      # Артефакты сохраняем всегда: если тесты упали, графики и витрина
      # помогают понять, что именно разъехалось в данных.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
